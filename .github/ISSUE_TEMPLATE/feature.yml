name: Feature proposal
description: A concrete improvement with reviewable acceptance criteria
title: 'feat: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behaviors and relevant edge cases.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should a reviewer verify this?
